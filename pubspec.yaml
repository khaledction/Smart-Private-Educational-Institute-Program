name: maehdi_app
description: "معهدّي — نظام إدارة المعاهد التعليمية الذكي (Desktop-First, Flutter)"
publish_to: 'none'
version: 3.8.8+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.0        # التحكم بنافذة سطح المكتب
  path_provider: ^2.1.4         # مسار آمن لقاعدة البيانات المحلية
  sqflite_common_ffi: ^2.3.4+4  # SQLite على Windows/Desktop
  # المرحلة التالية (عند توسيع الطبقة المحلية إلى كل الوحدات):
  # drift: ^2.20.0
  # sqlite3_flutter_libs: ^0.5.24
  # riverpod: ^2.5.1
  # flutter_riverpod: ^2.5.1
  # fl_chart: ^0.69.0
  # printing: ^5.13.0   # فواتير وشهادات PDF بدعم RTL

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # لتوزيع Windows:
  # msix: ^3.16.0

flutter:
  uses-material-design: true
